version: 2

project_name: cf

builds:
  - id: cf
    main: ./cmd/cf
    binary: cf
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/Autarquico/codefabric/internal/buildinfo.version={{.Version}}
      - -X github.com/Autarquico/codefabric/internal/buildinfo.commit={{.Commit}}
      - -X github.com/Autarquico/codefabric/internal/buildinfo.date={{.Date}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64

archives:
  - formats: [tar.gz]
    name_template: "cf_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

# Nothing is checksummed, signed or published here: packaging/release/finalize.sh and release.yml do that.
checksum:
  disable: true

release:
  disable: true

changelog:
  disable: true
