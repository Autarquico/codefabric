version: 2

project_name: cf

builds:
  - id: cf
    main: ./cmd/cf
    binary: cf
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/Autarquico/codefabric/internal/buildinfo.version={{.Version}}
      - -X github.com/Autarquico/codefabric/internal/buildinfo.commit={{.Commit}}
      - -X github.com/Autarquico/codefabric/internal/buildinfo.date={{.Date}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
