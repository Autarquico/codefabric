name: release

# Builds, signs and publishes a release. Runs only for v* tags. The build job runs third-party code and
# holds no secret and no write permission; only sign-publish, in the protected `release` environment,
# sees the signing key, and it executes nothing from the build but data (the three tarballs, after their
# digest and inventory are checked). The release is a draft until it has been verified as published.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing is built or signed unless every check in packaging/release/required-checks.txt succeeded on
  # this exact commit. The only job that reads checks.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: required checks succeeded on the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" >"$RUNNER_TEMP/check-runs.json"
          packaging/release/require-checks.sh packaging/release/required-checks.txt "$RUNNER_TEMP/check-runs.json"

  build:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      # go run verifies the module against go.sum / the checksum database; same version as the Makefile
      - name: build with GoReleaser
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }} # an rc and its final release can share a commit
        run: go run github.com/goreleaser/goreleaser/v2@v2.18.3 release --clean
      - name: record what was built
        id: manifest
        run: |
          cd dist
          sha256sum cf_*.tar.gz >SHA256SUMS
          [ "$(wc -l <SHA256SUMS | tr -d ' ')" -eq 3 ]
          echo "digest=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/cf_*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  sign-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: tag must point into main
        run: packaging/release/tag-in-main.sh "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: verify the artifact is what the build job recorded
        env:
          WANT_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          cd dist
          [ -n "$WANT_DIGEST" ]
          [ "$(sha256sum SHA256SUMS | cut -d' ' -f1)" = "$WANT_DIGEST" ]
          sha256sum -c SHA256SUMS
          [ "$(wc -l <SHA256SUMS | tr -d ' ')" -eq 3 ]
          [ "$(find . -mindepth 1 -type f ! -name SHA256SUMS | sed 's|^\./||' | sort)" = "$(awk '{print $2}' SHA256SUMS | sort)" ]
          [ "$(find . -mindepth 1 | wc -l | tr -d ' ')" -eq 4 ]
          rm SHA256SUMS
      - name: write checksums.txt and sign it and install.sh
        env:
          CF_RELEASE_SIGNING_KEY: ${{ secrets.CF_RELEASE_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          umask 077
          key="$RUNNER_TEMP/release_key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$CF_RELEASE_SIGNING_KEY" >"$key"
          CF_SIGNING_KEY_FILE="$key" packaging/release/finalize.sh dist "$TAG"
      - name: verify against the trust root embedded in install.sh at this commit
        run: packaging/release/check.sh dist install.sh
      - name: create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--draft --verify-tag --title "$TAG" --generate-notes)
          case $TAG in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "${flags[@]}" dist/cf_*.tar.gz dist/checksums.txt dist/checksums.txt.sig dist/install.sh dist/install.sh.sig
      - name: verify the draft as published, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! packaging/release/verify-release.sh "$TAG" install.sh "$GITHUB_REPOSITORY"; then
            gh release delete "$TAG" --yes
            exit 1
          fi
          gh release edit "$TAG" --draft=false
