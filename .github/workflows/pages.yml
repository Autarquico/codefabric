name: pages

# The website follows releases. Its content (docs/guide and the TUI golden frames) comes from a release
# tag and is treated as data; the tooling (site/) always comes from main, so a fix to the website never
# needs a new release. It runs after the `release` workflow succeeds for a tag push. A release created
# with the workflow token does not fire `release: published`, hence workflow_run.
# Manual dispatch rebuilds the site for an explicit, already published tag with the same checks.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to build the site for (vX.Y.Z or vX.Y.Z-suffix)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: the tag is a release tag and its release is published
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = workflow_dispatch ]; then tag="$INPUT_TAG"; else tag="$RUN_BRANCH"; fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "not a release tag: '$tag'" >&2
            exit 1
          fi
          draft="$(gh api "repos/$REPOSITORY/releases/tags/$tag" --jq '.draft')"
          if [ "$draft" != false ]; then
            echo "no published release for $tag (draft=$draft)" >&2
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

  # Builds and validates. Nothing is deployed unless the build, the script tests, the install-command
  # check and the axe run on the landing and a docs page all pass.
  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SITE_VERSION: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: site tooling from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: content from the release tag, as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          path: release
          persist-credentials: false
      - name: the tag still points at the commit the release was built from
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          if [ -n "$EXPECTED_SHA" ] && [ "$(git -C release rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "tag moved: HEAD is $(git -C release rev-parse HEAD), release ran on $EXPECTED_SHA" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: install
        working-directory: site
        run: npm ci
      - name: unit tests of the site scripts
        working-directory: site
        run: npm test
      - name: build for this tag
        working-directory: site
        env:
          CF_CONTENT_ROOT: ${{ github.workspace }}/release
        run: npm run build
      - name: the install commands carry the tag
        working-directory: site
        run: npm run check:install
      - name: axe on the landing and a docs page
        working-directory: site
        run: |
          npx --no-install playwright install --with-deps chromium
          npm run test:a11y
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  # Publishes the artifact and nothing else: no checkout, no npm, no secrets.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
