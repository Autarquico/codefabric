name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - run: make test-race

  integration:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y git tmux
      - if: runner.os == 'macOS'
        run: brew install tmux
      - run: git --version && tmux -V
      # Without tmux or git the tests that need them skip; here they must run.
      - run: make test-integration
        env:
          CF_REQUIRE_TMUX: "1"
          CF_REQUIRE_GIT: "1"

  # The scenarios of service-units against the real systemd --user and launchd
  # of the runner. A required check since the end of Phase 1 (B5).
  service-units:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y git tmux dbus-user-session gnome-keyring
      - if: runner.os == 'macOS'
        run: brew install tmux
      - if: runner.os == 'Linux'
        name: Start the user's systemd
        run: |
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if XDG_RUNTIME_DIR="/run/user/${uid}" systemctl --user show-environment >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "the user's systemd did not answer" >&2
          exit 1
      - run: CGO_ENABLED=1 go test -race -tags integration -count=1 -v -run 'TestScenario_ServiceUnits|TestServiceUnits' ./cmd/cf/
        env:
          CF_REQUIRE_TMUX: "1"
          CF_REQUIRE_GIT: "1"
          CF_REQUIRE_SYSTEMD: ${{ runner.os == 'Linux' && '1' || '' }}
          CF_REQUIRE_LAUNCHD: ${{ runner.os == 'macOS' && '1' || '' }}
      # The keyring backend of secrets against a real, isolated keyring: a
      # gnome-keyring-daemon with its own data dir on the user bus above, and a
      # temporary keychain that is the default one on macOS (the login keychain
      # is not touched). CF_REQUIRE_KEYRING makes the tests fail, not skip.
      - if: runner.os == 'Linux'
        name: Start an isolated Secret Service
        run: |
          data="$(mktemp -d)"
          echo "XDG_DATA_HOME=${data}" >> "$GITHUB_ENV"
          printf 'ci-keyring-password' | XDG_DATA_HOME="${data}" gnome-keyring-daemon --daemonize --unlock --components=secrets >/dev/null
          for _ in $(seq 1 30); do
            if busctl --user list --no-pager | grep -q org.freedesktop.secrets; then exit 0; fi
            sleep 1
          done
          echo "the Secret Service did not appear on the user bus" >&2
          exit 1
      - if: runner.os == 'macOS'
        name: Create a temporary default keychain
        run: |
          keychain="${RUNNER_TEMP}/cf-test.keychain-db"
          security create-keychain -p ci-keychain-password "${keychain}"
          security set-keychain-settings -lut 3600 "${keychain}"
          security unlock-keychain -p ci-keychain-password "${keychain}"
          security list-keychains -d user -s "${keychain}" "${HOME}/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "${keychain}"
      - name: Keyring tests
        shell: bash
        run: |
          set -o pipefail
          CGO_ENABLED=1 go test -race -tags integration -count=1 -v -run 'TestKeyring_' ./internal/adapters/secrets/keyring/ | tee keyring-tests.txt
          # a selection that matches nothing, or tests that skipped, would pass quietly
          passed="$(grep -c -e '^--- PASS: TestKeyring_' keyring-tests.txt || true)"
          expected="$(grep -c -e '^func TestKeyring_' internal/adapters/secrets/keyring/keyring_integration_test.go)"
          if [ "${expected}" -eq 0 ] || [ "${passed}" -ne "${expected}" ]; then echo "keyring tests passed: ${passed} of ${expected}" >&2; exit 1; fi
          if grep -q -e '--- SKIP' keyring-tests.txt; then echo 'a keyring test skipped' >&2; exit 1; fi
        env:
          CF_REQUIRE_KEYRING: "1"
      - if: always() && runner.os == 'macOS'
        name: Remove the temporary keychain
        run: |
          security default-keychain -d user -s "${HOME}/Library/Keychains/login.keychain-db"
          security delete-keychain "${RUNNER_TEMP}/cf-test.keychain-db" || true

  # The end-to-end suite against the real cf: the fixed seed corpus on ubuntu,
  # its first seed with slower timings on macOS.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CF_REQUIRE_TMUX: "1"
      CF_REQUIRE_GIT: "1"
      CF_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
      CF_E2E_SCALE: ${{ matrix.os == 'macos-latest' && '1.5' || '1' }}
      # Below the job's limit, so the tests fail and clean up before it cancels.
      E2E_TIMEOUT: 20m
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y git tmux
      - if: runner.os == 'macOS'
        run: brew install tmux
      - run: git --version && tmux -V
      - if: runner.os == 'macOS'
        name: Pick the first seed of the corpus
        run: |
          seed="$(awk '!/^[[:space:]]*(#|$)/ { print $1; exit }' internal/e2e/testdata/seeds.txt)"
          test -n "$seed"
          echo "E2E_SEED=$seed" >> "$GITHUB_ENV"
      - run: make test-e2e
      - if: always()
        run: make e2e-reap
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ matrix.os }}
          path: ${{ env.CF_E2E_ARTIFACTS }}
          if-no-files-found: ignore

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - run: make cross

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The installer and the release chain, against an ephemeral key. Registered in
  # packaging/release/required-checks.txt: release.yml refuses to build without it.
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: Install prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck openssh-client python3
      - name: Install prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - run: make test-installer

  # The release workflow is the only place that may touch the signing key.
  workflow-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - name: only release.yml/sign-publish names the release environment or the signing key
        run: |
          # yq (checked against go.sum and the checksum database) reads every job's environment, whatever its YAML form
          bad=""
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            skip=""
            [ "$f" != .github/workflows/release.yml ] || skip=sign-publish
            yq="go run github.com/mikefarah/yq/v4@v4.54.2"
            hits="$(SKIP="$skip" $yq -r '
              .jobs | to_entries | .[] | select(.key != strenv(SKIP))
                | select((.value.environment | (.name // .) | to_json | test("release|[$][{][{]"))
                         or (.value | to_json | contains("CF_RELEASE_SIGNING_KE" + "Y")))
                | .key' "$f")" || exit 1
            top="$($yq -r 'del(.jobs) | to_json | contains("CF_RELEASE_SIGNING_KE" + "Y")' "$f")" || exit 1
            [ "$top" = false ] || hits="$hits workflow-level reference"
            [ -z "$hits" ] || bad="$bad$f:\n$hits\n"
          done
          if [ -n "$bad" ]; then printf 'release custody violated (only release.yml/sign-publish may use the release environment or signing key):\n%b' "$bad" >&2; exit 1; fi
