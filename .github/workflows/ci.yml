name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - run: make test-race

  integration:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y git tmux
      - if: runner.os == 'macOS'
        run: brew install tmux
      - run: git --version && tmux -V
      # Without tmux or git the tests that need them skip; here they must run.
      - run: make test-integration
        env:
          CF_REQUIRE_TMUX: "1"
          CF_REQUIRE_GIT: "1"

  # The scenarios of service-units against the real systemd --user and launchd
  # of the runner. Not required, and allowed to fail, until it has passed twice
  # in a row: a hosted runner may not give the environment (B5).
  service-units:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y git tmux
      - if: runner.os == 'macOS'
        run: brew install tmux
      - if: runner.os == 'Linux'
        name: Start the user's systemd
        run: |
          uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if XDG_RUNTIME_DIR="/run/user/${uid}" systemctl --user show-environment >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "the user's systemd did not answer" >&2
          exit 1
      - run: CGO_ENABLED=1 go test -race -tags integration -count=1 -v -run 'TestScenario_ServiceUnits|TestServiceUnits' ./cmd/cf/
        env:
          CF_REQUIRE_TMUX: "1"
          CF_REQUIRE_GIT: "1"
          CF_REQUIRE_SYSTEMD: ${{ runner.os == 'Linux' && '1' || '' }}
          CF_REQUIRE_LAUNCHD: ${{ runner.os == 'macOS' && '1' || '' }}

  # The end-to-end suite against the real cf: the fixed seed corpus on ubuntu,
  # its first seed with slower timings on macOS.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CF_REQUIRE_TMUX: "1"
      CF_REQUIRE_GIT: "1"
      CF_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
      CF_E2E_SCALE: ${{ matrix.os == 'macos-latest' && '1.5' || '1' }}
      # Below the job's limit, so the tests fail and clean up before it cancels.
      E2E_TIMEOUT: 20m
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y git tmux
      - if: runner.os == 'macOS'
        run: brew install tmux
      - run: git --version && tmux -V
      - if: runner.os == 'macOS'
        name: Pick the first seed of the corpus
        run: |
          seed="$(awk '!/^[[:space:]]*(#|$)/ { print $1; exit }' internal/e2e/testdata/seeds.txt)"
          test -n "$seed"
          echo "E2E_SEED=$seed" >> "$GITHUB_ENV"
      - run: make test-e2e
      - if: always()
        run: make e2e-reap
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ matrix.os }}
          path: ${{ env.CF_E2E_ARTIFACTS }}
          if-no-files-found: ignore

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - run: make cross

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
